<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="robots" content="noindex, nofollow" />
		<title>Masar Petroleum · Messages</title>
		<link rel="icon" type="image/x-icon" href="/favicon.ico" />
		<style>
			:root {
				--primary: #2d3075;
				--primary-dark: #1f2157;
				--secondary: #b93330;
				--text: #2b2d3b;
				--muted: #62657a;
				--border: #e4e6f0;
				--bg: #f3f4fa;
				--tint: rgba(45, 48, 117, 0.07);
				--radius: 26px;
				--shadow: 0 1px 2px rgba(20, 22, 58, 0.05), 0 6px 18px -12px rgba(20, 22, 58, 0.18);
			}
			* {
				box-sizing: border-box;
			}
			body {
				margin: 0;
				background: var(--bg);
				color: var(--text);
				font: 16px/1.6 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
				-webkit-font-smoothing: antialiased;
			}
			[hidden] {
				display: none !important;
			}
			svg {
				flex: none;
				width: 18px;
				height: 18px;
				fill: none;
				stroke: currentColor;
				stroke-width: 2;
				stroke-linecap: round;
				stroke-linejoin: round;
			}
			:focus-visible {
				outline: 2px solid var(--primary);
				outline-offset: 2px;
			}

			/* Top bar */
			header {
				position: sticky;
				top: 0;
				z-index: 2;
				background: rgba(255, 255, 255, 0.9);
				backdrop-filter: saturate(180%) blur(14px);
				-webkit-backdrop-filter: saturate(180%) blur(14px);
				border-bottom: 1px solid var(--border);
			}
			.bar,
			main {
				max-width: 920px;
				margin: 0 auto;
				padding-inline: clamp(16px, 4vw, 32px);
			}
			.bar {
				display: flex;
				align-items: center;
				gap: 10px;
				min-height: 68px;
			}
			.bar img {
				width: auto;
				height: 44px;
			}
			.bar .spacer {
				flex: 1;
			}

			/* Buttons */
			.btn {
				display: inline-flex;
				align-items: center;
				justify-content: center;
				gap: 8px;
				min-height: 42px;
				padding: 0 18px;
				border: 1px solid var(--border);
				border-radius: 999px;
				background: #fff;
				color: var(--primary-dark);
				font: inherit;
				font-size: 0.9rem;
				font-weight: 600;
				line-height: 1;
				text-decoration: none;
				white-space: nowrap;
				cursor: pointer;
				transition:
					background-color 0.2s,
					border-color 0.2s,
					color 0.2s;
			}
			.btn:hover {
				background: var(--tint);
				border-color: transparent;
			}
			.btn.primary {
				border-color: var(--primary);
				background: var(--primary);
				color: #fff;
			}
			.btn.primary:hover {
				background: var(--primary-dark);
			}
			.btn.quiet {
				border-color: transparent;
				background: transparent;
			}
			.btn.quiet:hover {
				background: var(--tint);
			}
			.btn.danger:hover {
				background: rgba(185, 51, 48, 0.09);
				color: var(--secondary);
			}
			.btn:disabled {
				opacity: 0.55;
				cursor: default;
			}
			@media (max-width: 560px) {
				.bar .btn .label {
					display: none;
				}
				.bar .btn {
					width: 42px;
					padding: 0;
				}
			}

			main {
				padding-block: clamp(24px, 5vw, 44px) 80px;
			}

			/* Heading and tools */
			.head {
				display: flex;
				flex-wrap: wrap;
				align-items: flex-end;
				justify-content: space-between;
				gap: 16px 24px;
				margin-bottom: 20px;
			}
			h1 {
				margin: 0;
				color: var(--primary-dark);
				font-size: clamp(1.7rem, 1.3rem + 1.6vw, 2.25rem);
				line-height: 1.15;
				letter-spacing: -0.015em;
			}
			#status {
				margin: 6px 0 0;
				color: var(--muted);
			}
			#status[data-state='error'] {
				color: var(--secondary);
				font-weight: 600;
			}
			.tools {
				display: flex;
				flex-wrap: wrap;
				align-items: center;
				gap: 10px;
			}
			.tabs {
				display: inline-flex;
				padding: 4px;
				background: #fff;
				border: 1px solid var(--border);
				border-radius: 999px;
			}
			.tabs button {
				min-height: 34px;
				padding: 0 16px;
				border: 0;
				border-radius: 999px;
				background: transparent;
				color: var(--muted);
				font: inherit;
				font-size: 0.875rem;
				font-weight: 600;
				cursor: pointer;
			}
			.tabs button[aria-pressed='true'] {
				background: var(--primary);
				color: #fff;
			}
			.search {
				position: relative;
				flex: 1 1 200px;
			}
			.search svg {
				position: absolute;
				left: 14px;
				top: 50%;
				translate: 0 -50%;
				color: var(--muted);
			}
			.search input {
				width: 100%;
				height: 44px;
				padding: 0 16px 0 42px;
				background: #fff;
				border: 1px solid var(--border);
				border-radius: 999px;
				color: var(--text);
				font: inherit;
				font-size: 0.95rem;
			}
			.search input:focus {
				outline: 0;
				border-color: var(--primary);
				box-shadow: 0 0 0 4px rgba(45, 48, 117, 0.1);
			}

			/* Panels: sign-in and empty state */
			.panel {
				padding: clamp(36px, 7vw, 64px) 24px;
				background: #fff;
				border: 1px solid var(--border);
				border-radius: var(--radius);
				box-shadow: var(--shadow);
				text-align: center;
			}
			.panel .badge {
				display: inline-grid;
				place-items: center;
				width: 64px;
				height: 64px;
				margin-bottom: 16px;
				border-radius: 50%;
				background: var(--tint);
				color: var(--primary);
			}
			.panel .badge svg {
				width: 28px;
				height: 28px;
			}
			.panel h2 {
				margin: 0 0 6px;
				color: var(--primary-dark);
				font-size: 1.35rem;
			}
			.panel p {
				max-width: 44ch;
				margin: 0 auto 22px;
				color: var(--muted);
			}
			.panel p:last-child {
				margin-bottom: 0;
			}

			/* Messages */
			#list {
				display: grid;
				gap: 14px;
				list-style: none;
				margin: 0;
				padding: 0;
			}
			.msg {
				display: grid;
				grid-template-columns: auto minmax(0, 1fr);
				gap: 4px 16px;
				padding: clamp(18px, 3vw, 26px);
				background: #fff;
				border: 1px solid var(--border);
				border-radius: var(--radius);
				box-shadow: var(--shadow);
			}
			.avatar {
				display: grid;
				place-items: center;
				width: 48px;
				height: 48px;
				border-radius: 50%;
				background: var(--tint);
				color: var(--primary);
				font-size: 1rem;
				font-weight: 700;
				letter-spacing: 0.02em;
			}
			.msg.unread .avatar {
				background: var(--primary);
				color: #fff;
			}
			.msg-main {
				min-width: 0;
			}
			.msg-head {
				display: flex;
				flex-wrap: wrap;
				align-items: baseline;
				justify-content: space-between;
				gap: 2px 16px;
			}
			.msg-name {
				display: inline-flex;
				align-items: center;
				gap: 10px;
				color: var(--primary-dark);
				font-size: 1.1rem;
				font-weight: 600;
				overflow-wrap: anywhere;
			}
			.msg.unread .msg-name {
				font-weight: 700;
			}
			.new {
				padding: 3px 10px;
				border-radius: 999px;
				background: rgba(185, 51, 48, 0.1);
				color: var(--secondary);
				font-size: 0.7rem;
				font-weight: 700;
				letter-spacing: 0.08em;
				line-height: 1.4;
				text-transform: uppercase;
			}
			.msg-date {
				color: var(--muted);
				font-size: 0.875rem;
				white-space: nowrap;
			}
			.msg-contact {
				display: flex;
				flex-wrap: wrap;
				gap: 6px 8px;
				margin-top: 8px;
			}
			.chip {
				display: inline-flex;
				align-items: center;
				gap: 8px;
				max-width: 100%;
				padding: 5px 14px 5px 10px;
				border-radius: 999px;
				background: var(--bg);
				color: var(--primary);
				font-size: 0.875rem;
				text-decoration: none;
				overflow-wrap: anywhere;
			}
			.chip:hover {
				background: var(--tint);
			}
			.chip svg {
				width: 15px;
				height: 15px;
			}
			.msg-body {
				margin: 14px 0 16px;
				padding: 16px 18px;
				border-radius: 18px;
				background: var(--bg);
				white-space: pre-wrap;
				overflow-wrap: anywhere;
			}
			.msg-actions {
				display: flex;
				flex-wrap: wrap;
				gap: 8px;
			}
			.msg-actions .btn {
				min-height: 38px;
				padding: 0 16px;
			}
			.msg-actions .push {
				margin-left: auto;
			}
			@media (max-width: 560px) {
				.msg {
					grid-template-columns: minmax(0, 1fr);
				}
				.avatar {
					width: 40px;
					height: 40px;
					font-size: 0.875rem;
				}
				.msg-actions .push {
					margin-left: 0;
				}
			}
		</style>
	</head>
	<body>
		<!-- Icons, drawn once and reused. -->
		<svg hidden>
			<symbol id="i-mail" viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="3" /><path d="m22 7-10 6L2 7" /></symbol>
			<symbol id="i-phone" viewBox="0 0 24 24">
				<path
					d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2Z"
				/>
			</symbol>
			<symbol id="i-reply" viewBox="0 0 24 24"><path d="m9 17-5-5 5-5" /><path d="M20 18v-2a4 4 0 0 0-4-4H4" /></symbol>
			<symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5" /></symbol>
			<symbol id="i-unread" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4" /></symbol>
			<symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 11v6M14 11v6" /></symbol>
			<symbol id="i-refresh" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.6-6.4L21 8" /><path d="M21 3v5h-5" /></symbol>
			<symbol id="i-edit" viewBox="0 0 24 24"><path d="M12 20h9" /><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z" /></symbol>
			<symbol id="i-out" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9" /></symbol>
			<symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" /><path d="m20 20-3.5-3.5" /></symbol>
			<symbol id="i-inbox" viewBox="0 0 24 24"><path d="M22 12h-6l-2 3h-4l-2-3H2" /><path d="M5.5 5h13L22 12v6a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-6Z" /></symbol>
		</svg>

		<header>
			<div class="bar">
				<img src="/images/site/logo.png" alt="Masar Petroleum" width="57" height="44" />
				<span class="spacer"></span>
				<a class="btn quiet" href="/admin/" title="Content admin"><svg><use href="#i-edit" /></svg><span class="label">Content admin</span></a>
				<button class="btn quiet" id="refresh" type="button" title="Refresh" hidden><svg><use href="#i-refresh" /></svg><span class="label">Refresh</span></button>
				<button class="btn quiet" id="signout" type="button" title="Sign out" hidden><svg><use href="#i-out" /></svg><span class="label">Sign out</span></button>
			</div>
		</header>

		<main>
			<div class="head">
				<div>
					<h1>Messages</h1>
					<p id="status" role="status"></p>
				</div>
				<div class="tools" id="tools" hidden>
					<div class="tabs" role="group" aria-label="Show">
						<button type="button" data-filter="all" aria-pressed="true">All</button>
						<button type="button" data-filter="unread" aria-pressed="false">Unread</button>
					</div>
					<label class="search">
						<svg><use href="#i-search" /></svg>
						<input id="search" type="search" placeholder="Search messages" aria-label="Search messages" autocomplete="off" />
					</label>
				</div>
			</div>

			<div class="panel" id="signin-panel" hidden>
				<span class="badge"><svg><use href="#i-mail" /></svg></span>
				<h2>Contact form messages</h2>
				<p>Sign in with the GitHub account you use to edit the site.</p>
				<button class="btn primary" id="signin" type="button">Sign in with GitHub</button>
			</div>

			<div class="panel" id="empty" hidden>
				<span class="badge"><svg><use href="#i-inbox" /></svg></span>
				<h2 id="empty-title"></h2>
				<p id="empty-text"></p>
			</div>

			<ul id="list"></ul>
		</main>

		<script>
			// Messages are stored by the masar-messages Cloudflare Worker (see /worker in the repository).
			// Sign-in reuses the CMS's GitHub OAuth server; the Worker only answers people who can edit the repository.
			const API = 'https://masar-messages.miladsoft.workers.dev';
			const AUTH = 'https://masar-cms-auth.miladsoft.workers.dev';
			const SITE_ID = 'masarpetroleum.github.io';
			const TOKEN_KEY = 'masar-messages-token';

			const $ = (id) => document.getElementById(id);
			const status = $('status');
			const list = $('list');

			// Already signed in to the content admin? Use that sign-in, so there is no second prompt.
			const cmsToken = () => {
				try {
					return JSON.parse(localStorage.getItem('sveltia-cms.user') ?? '{}').token ?? null;
				} catch {
					return null;
				}
			};
			let token = sessionStorage.getItem(TOKEN_KEY) ?? cmsToken();
			let messages = [];
			let filter = 'all';
			let query = '';

			const say = (text, state = '') => {
				status.textContent = text;
				status.dataset.state = state;
			};

			const showSignedIn = (signedIn) => {
				$('signin-panel').hidden = signedIn;
				$('refresh').hidden = $('signout').hidden = !signedIn;
				if (!signedIn) {
					$('tools').hidden = $('empty').hidden = true;
					list.replaceChildren();
				}
			};

			const signOut = (message = '') => {
				token = null;
				sessionStorage.removeItem(TOKEN_KEY);
				showSignedIn(false);
				say(message, message ? 'error' : '');
			};

			async function api(path, options = {}) {
				const response = await fetch(API + path, {
					...options,
					headers: { authorization: `Bearer ${token}`, 'content-type': 'application/json', ...options.headers },
				});
				if (response.status === 401) {
					signOut('This GitHub account cannot view the messages. Sign in with an account that can edit the site.');
					throw new Error('unauthorized');
				}
				if (!response.ok) throw new Error(`Request failed (${response.status})`);
				return response.json();
			}

			const el = (tag, className, text) => {
				const node = document.createElement(tag);
				if (className) node.className = className;
				if (text !== undefined) node.textContent = text;
				return node;
			};

			const icon = (name) => {
				const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
				const use = document.createElementNS('http://www.w3.org/2000/svg', 'use');
				use.setAttribute('href', `#i-${name}`);
				svg.setAttribute('aria-hidden', 'true');
				svg.append(use);
				return svg;
			};

			const button = (tag, className, iconName, label) => {
				const node = el(tag, className);
				if (tag === 'button') node.type = 'button';
				node.append(icon(iconName), el('span', '', label));
				return node;
			};

			const initials = (name) =>
				name
					.split(/\s+/)
					.filter(Boolean)
					.slice(0, 2)
					.map((word) => word[0].toUpperCase())
					.join('') || '?';

			const dateFormat = new Intl.DateTimeFormat(undefined, { dateStyle: 'medium', timeStyle: 'short' });

			function card(m) {
				const item = el('li', m.read ? 'msg' : 'msg unread');
				const main = el('div', 'msg-main');

				const head = el('div', 'msg-head');
				const name = el('span', 'msg-name', m.name);
				if (!m.read) name.append(el('span', 'new', 'New'));
				const date = el('time', 'msg-date', dateFormat.format(new Date(m.created_at)));
				date.dateTime = m.created_at;
				head.append(name, date);

				const contact = el('div', 'msg-contact');
				if (m.email) {
					const chip = button('a', 'chip', 'mail', m.email);
					chip.href = `mailto:${m.email}`;
					contact.append(chip);
				}
				if (m.phone) {
					const chip = button('a', 'chip', 'phone', m.phone);
					chip.href = `tel:${m.phone.replace(/[^\d+]/g, '')}`;
					contact.append(chip);
				}

				const actions = el('div', 'msg-actions');
				if (m.email) {
					const reply = button('a', 'btn primary', 'reply', 'Reply');
					reply.href = `mailto:${m.email}?subject=${encodeURIComponent('Re: your message to Masar Petroleum')}`;
					actions.append(reply);
				}
				const toggle = button('button', 'btn', m.read ? 'unread' : 'check', m.read ? 'Mark as unread' : 'Mark as read');
				toggle.addEventListener('click', () => {
					toggle.disabled = true;
					api(`/messages/${m.id}`, { method: 'PATCH', body: JSON.stringify({ read: !m.read }) }).then(load, () => (toggle.disabled = false));
				});
				const remove = button('button', 'btn quiet danger push', 'trash', 'Delete');
				remove.addEventListener('click', () => {
					if (!confirm(`Delete the message from ${m.name}? This cannot be undone.`)) return;
					remove.disabled = true;
					api(`/messages/${m.id}`, { method: 'DELETE' }).then(load, () => (remove.disabled = false));
				});
				actions.append(toggle, remove);

				main.append(head, contact, el('p', 'msg-body', m.message), actions);
				item.append(el('span', 'avatar', initials(m.name)), main);
				return item;
			}

			function render() {
				const unread = messages.filter((m) => !m.read).length;
				say(messages.length ? `${messages.length} message${messages.length > 1 ? 's' : ''} · ${unread} unread` : '');
				$('tools').hidden = !messages.length;

				const words = query.toLowerCase().split(/\s+/).filter(Boolean);
				const shown = messages.filter((m) => {
					if (filter === 'unread' && m.read) return false;
					const text = `${m.name} ${m.email} ${m.phone} ${m.message}`.toLowerCase();
					return words.every((word) => text.includes(word));
				});
				list.replaceChildren(...shown.map(card));

				$('empty').hidden = shown.length > 0;
				if (!shown.length) {
					const none = !messages.length;
					$('empty-title').textContent = none ? 'No messages yet' : 'Nothing to show';
					$('empty-text').textContent = none
						? 'Messages sent from the contact form on the website will appear here.'
						: filter === 'unread' && !words.length
							? 'You have read every message.'
							: 'No message matches this search or filter.';
				}
			}

			async function load() {
				if (!token) return showSignedIn(false);
				showSignedIn(true);
				if (!messages.length) say('Loading…');
				try {
					messages = (await api('/messages')).messages;
					render();
				} catch (error) {
					if (error.message !== 'unauthorized') say('Could not load the messages. Check your connection and press Refresh.', 'error');
				}
			}

			// GitHub sign-in in a popup, using the same handshake as the CMS.
			function signIn() {
				const popup = window.open(
					`${AUTH}/auth?provider=github&site_id=${encodeURIComponent(SITE_ID)}&scope=repo,user`,
					'masar-auth',
					'width=600,height=700',
				);
				if (!popup) return say('Allow pop-ups for this page, then press Sign in again.', 'error');
				const onMessage = (event) => {
					if (event.origin !== new URL(AUTH).origin || typeof event.data !== 'string') return;
					if (event.data === 'authorizing:github') return popup.postMessage(event.data, event.origin);
					const match = event.data.match(/^authorization:github:(success|error):(.*)$/s);
					if (!match) return;
					window.removeEventListener('message', onMessage);
					popup.close();
					try {
						const result = JSON.parse(match[2]);
						if (match[1] !== 'success' || !result.token) throw new Error();
						token = result.token;
						sessionStorage.setItem(TOKEN_KEY, token);
						load();
					} catch {
						say('GitHub sign-in did not finish. Please try again.', 'error');
					}
				};
				window.addEventListener('message', onMessage);
			}

			document.querySelectorAll('[data-filter]').forEach((tab) =>
				tab.addEventListener('click', () => {
					filter = tab.dataset.filter;
					document.querySelectorAll('[data-filter]').forEach((t) => t.setAttribute('aria-pressed', String(t === tab)));
					render();
				}),
			);
			$('search').addEventListener('input', (event) => {
				query = event.target.value;
				render();
			});
